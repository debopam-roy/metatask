name: Staging Deployment

on:
  pull_request:
    branches: [ stage ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ stage ]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9.0.0'

jobs:
  # Pre-deployment validation (runs on PRs)
  validate:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm check-types

      - name: Run API tests
        run: pnpm --filter api test

      - name: Build applications
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Comment PR Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Pre-deployment validation passed!** \n\n- Security audit: ✅\n- Linting: ✅\n- Type checking: ✅\n- Tests: ✅\n- Build: ✅\n\nReady for staging deployment once merged.'
            })

  # Staging deployment (runs when merged to stage)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run final tests
        run: |
          pnpm lint
          pnpm --filter api test
          pnpm --filter api test:e2e
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Build applications
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Deploy Web App to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: |
            staging.metatask.ai

      - name: Deploy API to Staging
        run: |
          # Install Railway CLI
          npm install -g @railway/cli
          
          # Deploy using Railway CLI
          railway deploy --service metatask-api-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PORT: 4000
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Wait for deployment
        run: sleep 30

      - name: Health Check - Web App
        run: |
          for i in {1..5}; do
            if curl -f https://staging.metatask.ai; then
              echo "✅ Web app is healthy"
              break
            else
              echo "❌ Attempt $i failed, retrying..."
              sleep 10
            fi
          done

      - name: Health Check - API
        run: |
          for i in {1..5}; do
            if curl -f ${{ secrets.STAGING_API_URL }}/api; then
              echo "✅ API is healthy"
              break
            else
              echo "❌ Attempt $i failed, retrying..."
              sleep 10
            fi
          done

      - name: Run API endpoint tests
        run: |
          # Test newsletter subscription endpoint
          curl -X POST ${{ secrets.STAGING_API_URL }}/api/newsletter-subscription \
            -H "Content-Type: application/json" \
            -d '{"email": "test@example.com"}' \
            -f || exit 1

      - name: Create deployment summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services:" >> $GITHUB_STEP_SUMMARY
          echo "- **Web App**: https://staging.metatask.ai" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ secrets.STAGING_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Checks:" >> $GITHUB_STEP_SUMMARY
          echo "- Web App: ✅ Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- API: ✅ Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- Newsletter API: ✅ Functional" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Test the staging environment thoroughly" >> $GITHUB_STEP_SUMMARY
          echo "2. When ready, create PR from \`stage\` to \`prod\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Use manual production deployment workflow" >> $GITHUB_STEP_SUMMARY

      - name: Notify team of successful staging deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🎯 **Staging Deployment Successful!**
            
            🌐 **Web**: https://staging.metatask.ai
            🔌 **API**: ${{ secrets.STAGING_API_URL }}
            
            ✅ All health checks passed
            📋 Ready for production review
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Notification for failed deployments
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [validate, deploy-staging]
    if: failure()
    steps:
      - name: Notify team of failure
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **Staging Pipeline Failed!**
            
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            
            Please check the GitHub Actions logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
