name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string
      confirm_production:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests (only for hotfixes)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '9.0.0'

jobs:
  # Validation job
  validate-deployment:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "❌ Production deployment not confirmed. Please type 'DEPLOY' to confirm."
            exit 1
          fi
          
          if [ "${{ github.ref }}" != "refs/heads/prod" ]; then
            echo "❌ Production deployment can only be triggered from 'prod' branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          
          echo "✅ Deployment validation passed"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Branch: ${{ github.ref }}"

  # Pre-deployment security and quality checks
  security-and-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: [validate-deployment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Run vulnerability scan with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm check-types

  # Comprehensive testing
  test:
    name: Production Tests
    runs-on: ubuntu-latest
    needs: [security-and-quality]
    if: github.event.inputs.skip_tests != 'true'
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: pnpm --filter api test

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: pnpm --filter api test:e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run e2e tests
        if: matrix.test-type == 'e2e'
        run: |
          # Start API server in background
          pnpm --filter api build
          pnpm --filter api start:prod &
          API_PID=$!
          
          # Wait for API to be ready
          sleep 10
          
          # Run e2e tests here (when implemented)
          echo "E2E tests would run here"
          
          # Clean up
          kill $API_PID
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # Build production artifacts
  build:
    name: Build Production Artifacts
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production artifacts
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.event.inputs.version }}
          path: |
            apps/web/.next/
            apps/api/dist/
          retention-days: 90

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download production artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.event.inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Web App to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'
          alias-domains: |
            metatask.ai
            www.metatask.ai

      - name: Deploy API to Production
        run: |
          # Install Railway CLI
          npm install -g @railway/cli
          
          # Deploy using Railway CLI
          railway deploy --service metatask-api-production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PORT: 4000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # Database migrations
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [deploy-production]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: |
          echo "Running database migrations for version ${{ github.event.inputs.version }}"
          # Add your migration commands here
          echo "Database migrations completed"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Comprehensive health checks
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production, migrate-database]
    steps:
      - name: Wait for deployment stabilization
        run: sleep 60

      - name: Health Check - Web App
        run: |
          echo "🔍 Checking Web App Health..."
          for i in {1..10}; do
            if curl -f https://metatask.ai; then
              echo "✅ Web app is healthy"
              break
            else
              echo "❌ Attempt $i failed, retrying..."
              sleep 15
            fi
          done

      - name: Health Check - API
        run: |
          echo "🔍 Checking API Health..."
          for i in {1..10}; do
            if curl -f ${{ secrets.PRODUCTION_API_URL }}/api; then
              echo "✅ API is healthy"
              break
            else
              echo "❌ Attempt $i failed, retrying..."
              sleep 15
            fi
          done

      - name: Run API endpoint tests
        run: |
          echo "🔍 Testing API endpoints..."
          
          # Test newsletter subscription endpoint
          curl -X POST ${{ secrets.PRODUCTION_API_URL }}/api/newsletter-subscription \
            -H "Content-Type: application/json" \
            -d '{"email": "healthcheck@metatask.ai"}' \
            -f || exit 1
          
          echo "✅ API endpoints are functional"

  # Performance monitoring
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: [health-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://metatask.ai
          configPath: './lighthouse.config.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Security scan post-deployment
  security-scan:
    name: Post-Deployment Security Scan
    runs-on: ubuntu-latest
    needs: [health-check]
    steps:
      - name: OWASP ZAP Security Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'https://metatask.ai'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  # Create release and tag
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [performance-monitoring, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ github.event.inputs.version }}" -m "Production release ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            ## 🚀 Production Release ${{ github.event.inputs.version }}
            
            ### Deployed Services:
            - **Web App**: https://metatask.ai
            - **API**: ${{ secrets.PRODUCTION_API_URL }}
            
            ### What's Changed:
            - Check the commit history for detailed changes
            
            ### Health Status:
            - ✅ Web App: Healthy
            - ✅ API: Healthy
            - ✅ Performance: Passed
            - ✅ Security: Scanned
            
            ### Deployment Details:
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref }}
            - **Deployed by**: ${{ github.actor }}
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

  # Final notifications
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - name: Notify team of successful production deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🎉 **Production Deployment Successful!**
            
            🏷️ **Version**: ${{ github.event.inputs.version }}
            🌐 **Web**: https://metatask.ai
            🔌 **API**: ${{ secrets.PRODUCTION_API_URL }}
            
            ✅ All health checks passed
            ✅ Performance monitoring passed
            ✅ Security scan completed
            🏷️ Release created: ${{ github.event.inputs.version }}
            
            **Deployed by**: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Rollback capability
  rollback:
    name: Rollback (On Failure)
    runs-on: ubuntu-latest
    needs: [deploy-production, migrate-database, health-check]
    if: failure()
    environment: production
    steps:
      - name: Notify team of deployment failure
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **Production Deployment Failed!**
            
            🏷️ **Version**: ${{ github.event.inputs.version }}
            🌐 **Target**: https://metatask.ai
            
            ⚠️ **Initiating rollback procedures...**
            
            Please check the GitHub Actions logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback Web App
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--rollback'

      - name: Rollback API
        run: |
          echo "API rollback would be triggered here"
          # Add rollback logic for your API deployment
          echo "Manual intervention may be required for API rollback"

      - name: Notify rollback completion
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🔄 **Rollback Completed**
            
            🏷️ **Failed Version**: ${{ github.event.inputs.version }}
            
            ✅ Web app rolled back
            ⚠️ API rollback may require manual intervention
            
            Please investigate the failure and retry deployment.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
